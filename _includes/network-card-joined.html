{% comment %}
  Goal & Constraints: Peer tenure line for every identity when
  first_participated_at is present. Same weight as domain meta—not a badge.
{% endcomment %}
{% if network_site.k2j and network_site.k2j != '' %}
  <p class="network-card__joined">
    Participating since
    <time datetime="{{ network_site.k2j | escape }}">
      {{ network_site.k2j | date: '%-d %b %Y' }}
    </time>
  </p>
{% endif %}
