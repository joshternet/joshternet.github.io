<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.url == '/' %}{{ site.title | escape }}{% else %}{{ page.title | default: site.title | escape }} | {{ site.title | escape }}{% endif %}</title>
    {% seo title=false %}
    {% if page.url == '/' %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Project",
      "@id": {{ '/#project' | absolute_url | jsonify }},
      "name": {{ site.title | jsonify }},
      "description": {{ site.description | jsonify }},
      "url": {{ '/' | absolute_url | jsonify }},
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": {{ '/' | absolute_url | jsonify }}
      }
    }
    </script>
    {% endif %}
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}">
    <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {% assign page_slug = page.url | remove_first: '/' | split: '/' | first | default: 'home' %}
  </head>
  <body class="site-shell page page--{{ page_slug }}">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-identity h-card p-name p-org u-url u-uid" href="{{ '/' | relative_url }}">Joshternet</a>

        <nav class="site-nav" aria-label="Primary">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
          <a href="{{ '/specs/' | relative_url }}"{% if page.url == '/specs/' %} aria-current="page"{% endif %}>Specifications</a>
          <a href="{{ '/governance/' | relative_url }}"{% if page.url == '/governance/' %} aria-current="page"{% endif %}>Governance</a>
          <a href="{{ '/implement/' | relative_url }}"{% if page.url == '/implement/' %} aria-current="page"{% endif %}>Implement</a>
        </nav>
      </div>
    </header>

    <main class="site-main" id="main-content" tabindex="-1">
      <div class="prose">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <span>Joshternet</span>
      </div>
    </footer>
  </body>
</html>
