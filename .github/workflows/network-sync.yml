name: Update Joshternet Network

on:
  workflow_dispatch:
    inputs:
      refresh_all:
        description: Refresh every participant screenshot and metadata
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "17 * * * *"

  repository_dispatch:
    types:
      - joshternet-registry-updated

  push:
    branches:
      - main
    paths:
      - ".github/workflows/network-sync.yml"
      - "scripts/network/**"
      - "scripts/nlp/**"
      - "scripts/views/**"
      - "schemas/**"
      - "test/network/**"
      - "test/nlp/**"
      - "test/browser/**"
      - "package.json"
      - "package-lock.json"
      - "_config.yml"
      - "_layouts/default.html"
      - "_layouts/topic.html"
      - "_includes/**"
      - "network.md"
      - "wander.md"
      - "connections.md"
      - "topics/**"
      - "network-data.json"
      - "connections-data.json"
      - "assets/js/network.js"
      - "assets/js/wander.js"
      - "assets/js/connections.js"
      - "assets/css/main.css"

concurrency:
  group: joshternet-network-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    name: Capture participant sites
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      needs_sync: ${{ steps.preflight.outputs.needs_sync }}

    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Decide whether sync is needed
        id: preflight
        shell: bash
        run: |
          # Always run: registry membership, feeds, blogrolls, and elsewhere
          # must stay aligned even when screenshots are still fresh.
          echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          echo "Running network sync for membership, feeds, elsewhere, and captures."

      - name: Install dependencies
        if: steps.preflight.outputs.needs_sync == 'true'
        run: npm ci

      - name: Run library tests with 100% coverage gate
        if: steps.preflight.outputs.needs_sync == 'true'
        run: npm run test:coverage

      - name: Install Playwright Chromium
        if: steps.preflight.outputs.needs_sync == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run browser security tests
        if: steps.preflight.outputs.needs_sync == 'true'
        run: npm run test:browser

      - name: Update generated network data
        if: steps.preflight.outputs.needs_sync == 'true'
        env:
          NETWORK_REFRESH_ALL: ${{ inputs.refresh_all || 'false' }}
        run: npm run network:sync

      - name: Crawl sites and rebuild topics/connections
        if: steps.preflight.outputs.needs_sync == 'true'
        run: npm run nlp:sync

      - name: Validate graph invariants
        if: steps.preflight.outputs.needs_sync == 'true'
        run: npm run nlp:validate

      - name: Validate topic quality
        if: steps.preflight.outputs.needs_sync == 'true'
        run: npm run nlp:quality

      - name: Validate generated JSON
        if: steps.preflight.outputs.needs_sync == 'true'
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const data = JSON.parse(
              fs.readFileSync("_data/network.json", "utf8"),
          );

          if (!Array.isArray(data)) {
              throw new Error(
                  "_data/network.json must contain an array",
              );
          }

          for (const entry of data) {
              if (
                  !entry ||
                  typeof entry !== "object" ||
                  typeof entry.origin !== "string" ||
                  typeof entry.domain !== "string" ||
                  ![
                      "affirmed",
                      "declined",
                      "undeclared",
                  ].includes(entry.identity)
              ) {
                  throw new Error(
                      "Invalid generated network entry: " +
                      JSON.stringify(entry),
                  );
              }

              if (Object.hasOwn(entry, "elsewhere")) {
                  if (!Array.isArray(entry.elsewhere)) {
                      throw new Error(
                          "elsewhere must be an array: " + entry.origin,
                      );
                  }

                  for (const item of entry.elsewhere) {
                      if (
                          !item ||
                          typeof item !== "object" ||
                          typeof item.url !== "string" ||
                          typeof item.network !== "string" ||
                          typeof item.label !== "string"
                      ) {
                          throw new Error(
                              "Invalid elsewhere item for " +
                              entry.origin +
                              ": " +
                              JSON.stringify(item),
                          );
                      }
                  }
              }
          }

          const blogrolls = JSON.parse(
              fs.readFileSync("_data/blogrolls.json", "utf8"),
          );

          if (
              !blogrolls ||
              typeof blogrolls !== "object" ||
              Array.isArray(blogrolls) ||
              typeof blogrolls.edge_count !== "number"
          ) {
              throw new Error(
                  "_data/blogrolls.json must be a collection document",
              );
          }

          if (JSON.stringify(blogrolls) === "[]") {
              throw new Error("_data/blogrolls.json must not be an empty array");
          }

          const blogrollEdges = Array.isArray(blogrolls.edges)
              ? blogrolls.edges
              : [];

          for (const edge of blogrollEdges) {
              if (
                  !edge ||
                  typeof edge !== "object" ||
                  typeof edge.from !== "string" ||
                  typeof edge.to !== "string" ||
                  typeof edge.blogroll !== "string"
              ) {
                  throw new Error(
                      "Invalid generated blogroll edge: " +
                      JSON.stringify(edge),
                  );
              }
          }

          const opml = fs.readFileSync(
              "assets/network/joshternet.opml",
              "utf8",
          );

          if (!opml.includes("<opml")) {
              throw new Error(
                  "assets/network/joshternet.opml must contain OPML",
              );
          }

          const connections = JSON.parse(
              fs.readFileSync("_data/connections.json", "utf8"),
          );

          if (
              !connections ||
              typeof connections !== "object" ||
              Array.isArray(connections) ||
              typeof connections.edge_count !== "number"
          ) {
              throw new Error(
                  "_data/connections.json must be a collection document",
              );
          }

          const connectionEdges = Array.isArray(connections.edges)
              ? connections.edges
              : [];

          for (const edge of connectionEdges) {
              if (
                  !edge ||
                  typeof edge !== "object" ||
                  typeof edge.from !== "string" ||
                  typeof edge.to !== "string" ||
                  typeof edge.href !== "string" ||
                  String(edge.href).includes("/.well-known/josh")
              ) {
                  throw new Error(
                      "Invalid connection edge: " +
                      JSON.stringify(edge),
                  );
              }
          }

          const topics = JSON.parse(
              fs.readFileSync("_data/topics.json", "utf8"),
          );

          if (
              !topics ||
              typeof topics !== "object" ||
              Array.isArray(topics) ||
              typeof topics.community_count !== "number"
          ) {
              throw new Error(
                  "_data/topics.json must be a collection document",
              );
          }

          const signals = JSON.parse(
              fs.readFileSync("_data/site_signals.json", "utf8"),
          );

          if (
              !signals ||
              typeof signals !== "object" ||
              !Array.isArray(signals.origins)
          ) {
              throw new Error(
                  "_data/site_signals.json must have origins[]",
              );
          }

          console.log(
              `Validated ${data.length} generated network ` +
              `${data.length === 1 ? "entry" : "entries"}, ` +
              `${blogrolls.length} blogroll ` +
              `${blogrolls.length === 1 ? "edge" : "edges"}, ` +
              `${connections.length} connection ` +
              `${connections.length === 1 ? "edge" : "edges"}, and ` +
              `${topics.length} topic` +
              `${topics.length === 1 ? "" : "s"}.`,
          );
          NODE

      - name: Upload generated network
        if: steps.preflight.outputs.needs_sync == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: network-generated
          retention-days: 1
          if-no-files-found: error
          path: |
            _data/network.json
            _data/blogrolls.json
            _data/connections.json
            _data/topics.json
            _data/site_signals.json
            _data/content.json
            _data/data_manifest.json
            _data/activity.json
            _data/explore.json
            _data/topic_views.json
            _data/connection_topics.json
            _data/site_views.json
            _data/search_index.json
            topics/
            assets/network/joshternet.opml
            assets/network/sites/
            assets/activity/posters/

  publish:
    name: Publish generated network
    needs:
      - scrape
    if: needs.scrape.outputs.needs_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pages: write

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download generated network
        uses: actions/download-artifact@v4
        with:
          name: network-generated
          path: .network-sync-output

      - name: Replace generated files
        run: |
          test -f .network-sync-output/_data/network.json
          test -f .network-sync-output/_data/blogrolls.json
          test -f .network-sync-output/_data/connections.json
          test -f .network-sync-output/_data/topics.json
          test -f .network-sync-output/_data/site_signals.json
          test -f .network-sync-output/assets/network/joshternet.opml

          mkdir -p _data
          mkdir -p assets/network
          mkdir -p topics

          cp \
            .network-sync-output/_data/network.json \
            _data/network.json

          cp \
            .network-sync-output/_data/blogrolls.json \
            _data/blogrolls.json

          cp \
            .network-sync-output/_data/connections.json \
            _data/connections.json

          cp \
            .network-sync-output/_data/topics.json \
            _data/topics.json

          cp \
            .network-sync-output/_data/site_signals.json \
            _data/site_signals.json

          if [ -f .network-sync-output/_data/content.json ]; then
            cp \
              .network-sync-output/_data/content.json \
              _data/content.json
          fi

          if [ -f .network-sync-output/_data/data_manifest.json ]; then
            cp \
              .network-sync-output/_data/data_manifest.json \
              _data/data_manifest.json
          fi

          for dataset in \
            activity.json \
            explore.json \
            topic_views.json \
            connection_topics.json \
            site_views.json \
            search_index.json
          do
            test -f ".network-sync-output/_data/${dataset}"
            cp \
              ".network-sync-output/_data/${dataset}" \
              "_data/${dataset}"
          done

          find topics -maxdepth 1 -type f -name '*.md' ! -name 'index.md' -delete
          mkdir -p topics

          if [ -d .network-sync-output/topics ]; then
            for page in .network-sync-output/topics/*.md; do
              [ -f "$page" ] || continue
              base="$(basename "$page")"
              if [ "$base" != "index.md" ]; then
                cp "$page" "topics/$base"
              fi
            done
          fi

          cp \
            .network-sync-output/assets/network/joshternet.opml \
            assets/network/joshternet.opml

          rm -rf assets/network/sites
          mkdir -p assets/network/sites

          if [ -d .network-sync-output/assets/network/sites ]; then
            cp -R \
              .network-sync-output/assets/network/sites/. \
              assets/network/sites/
          fi

          rm -rf assets/activity/posters
          mkdir -p assets/activity/posters

          if [ -d .network-sync-output/assets/activity/posters ]; then
            cp -R \
              .network-sync-output/assets/activity/posters/. \
              assets/activity/posters/
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format generated datasets
        run: npm run format:data

      - name: Commit generated changes
        id: commit_network
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            _data/network.json \
            _data/blogrolls.json \
            _data/connections.json \
            _data/topics.json \
            _data/site_signals.json \
            _data/content.json \
            _data/data_manifest.json \
            _data/activity.json \
            _data/explore.json \
            _data/topic_views.json \
            _data/connection_topics.json \
            _data/site_views.json \
            _data/search_index.json \
            topics \
            assets/network/joshternet.opml \
            assets/network/sites \
            assets/activity/posters

          if git diff --cached --quiet; then
            echo "Network data is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update Joshternet network"
          git push origin HEAD:main

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild
        if: steps.commit_network.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/pages/builds"
