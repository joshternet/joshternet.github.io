name: Update Joshternet Network

on:
  workflow_dispatch:
    inputs:
      refresh_all:
        description: Refresh every participant screenshot and metadata
        required: false
        type: boolean
        default: false

  schedule:
    # Six-hour complete observation generations at minute 17 (avoid top-of-hour delay).
    - cron: "17 */6 * * *"

  repository_dispatch:
    types:
      - joshternet-registry-updated

  push:
    branches:
      - main
    paths:
      - ".github/workflows/network-sync.yml"
      - "scripts/network/**"
      - "scripts/nlp/**"
      - "scripts/views/**"
      - "scripts/uses/**"
      - "scripts/observation/**"
      - "data/uses/catalog/**"
      - "data/ownership.json"
      - "test/observation/**"
      - "data/classification/**"
      - "test/network/**"
      - "test/nlp/**"
      - "test/views/**"
      - "test/uses/**"
      - "test/browser/**"
      - "package.json"
      - "package-lock.json"
      - "_config.yml"
      - "_layouts/default.html"
      - "_layouts/topic.html"
      - "_includes/**"
      - "network.md"
      - "wander.md"
      - "connections.md"
      - "uses.md"
      - "topics/**"
      - "network-data.json"
      - "connections-data.json"
      - "assets/js/network.js"
      - "assets/js/wander.js"
      - "assets/js/connections.js"
      - "assets/js/uses.js"
      - "assets/css/main.css"

concurrency:
  group: joshternet-network-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-and-publish:
    name: Sync and publish network
    runs-on: ubuntu-latest
    # No job timeout: crawl/rebuild grows with membership. GitHub’s
    # default (360m) is the ceiling for hosted runners.

    permissions:
      contents: write
      pages: write

    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Capture base SHA
        id: base
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Base commit: $(git rev-parse HEAD)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Decide whether sync is needed
        id: preflight
        shell: bash
        run: |
          # Always run: registry membership, feeds, blogrolls, and elsewhere
          # must stay aligned even when screenshots are still fresh.
          echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          echo "Running network sync for membership, feeds, elsewhere, and captures."

      - name: Install dependencies
        if: steps.preflight.outputs.needs_sync == 'true'
        run: npm ci

      - name: Run library tests with 100% coverage gate
        if: steps.preflight.outputs.needs_sync == 'true'
        run: npm run test:coverage

      - name: Install Playwright Chromium
        if: steps.preflight.outputs.needs_sync == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run browser security tests
        if: steps.preflight.outputs.needs_sync == 'true'
        run: npm run test:browser

      - name: Restore HTTP fetch cache
        if: steps.preflight.outputs.needs_sync == 'true'
        uses: actions/cache@v4
        with:
          path: .tmp/http-cache
          key: nlp-http-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nlp-http-cache-${{ runner.os }}-

      - name: Update generated network data
        if: steps.preflight.outputs.needs_sync == 'true'
        env:
          NETWORK_REFRESH_ALL: ${{ inputs.refresh_all || 'false' }}
          # Authenticated GitHub Users API for person-shaped titles from
          # elsewhere profiles (avoids unauthenticated 60/hr limits).
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run network:sync

      - name: Restore local classifier
        if: steps.preflight.outputs.needs_sync == 'true'
        uses: actions/cache@v4
        with:
          path: .tmp/models
          key: uses-model-${{ runner.os }}-${{ hashFiles('data/classification/model-lock.json') }}
          restore-keys: |
            uses-model-${{ runner.os }}-

      - name: Prepare local classifier
        if: steps.preflight.outputs.needs_sync == 'true'
        run: node scripts/uses/prepare-model.mjs

      - name: Classify frozen snapshot with network blocked
        if: steps.preflight.outputs.needs_sync == 'true'
        run: npm run test:classify-local

      - name: Crawl sites and rebuild topics/connections
        if: steps.preflight.outputs.needs_sync == 'true'
        env:
          # Shadow by default: uses history is computed and validated but
          # not staged for commit until an operator enables publish.
          # The Uses build loads the local classifier prepared above.
          JOSHTERNET_USES_PUBLISH: ${{ vars.JOSHTERNET_USES_PUBLISH || '0' }}
        run: npm run nlp:sync

      - name: Format generated datasets before validate
        if: steps.preflight.outputs.needs_sync == 'true'
        run: npm run format:data

      - name: Fail closed if Prettier still reports dirty files
        if: steps.preflight.outputs.needs_sync == 'true'
        run: npm run format:check

      - name: Validate graph invariants
        if: steps.preflight.outputs.needs_sync == 'true'
        run: npm run nlp:validate

      - name: Validate topic quality
        if: steps.preflight.outputs.needs_sync == 'true'
        run: npm run nlp:quality

      - name: Validate uses datasets
        if: steps.preflight.outputs.needs_sync == 'true'
        run: npm run uses:validate

      - name: Validate uses quality
        if: steps.preflight.outputs.needs_sync == 'true'
        run: npm run uses:quality

      - name: Enforce dataset ownership on generated paths
        if: steps.preflight.outputs.needs_sync == 'true'
        run: |
          # Fail closed on undeclared generated datasets (ownership class + writer).
          node scripts/observation/check-ownership.mjs \
            _data/network.json \
            _data/content.json \
            _data/topics.json \
            _data/site_signals.json \
            _data/data_manifest.json \
            _data/generation_manifest.json \
            _data/connections.json \
            _data/blogrolls.json \
            _data/activity.json \
            _data/showcase.json \
            _data/happening.json

      - name: Write observation generation provenance manifest
        if: steps.preflight.outputs.needs_sync == 'true'
        env:
          OBSERVATION_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          BASE_GIT_SHA: ${{ steps.base.outputs.sha }}
          STARTED_AT: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
        run: node scripts/observation/write-generation-manifest.mjs

      - name: Validate generated JSON
        if: steps.preflight.outputs.needs_sync == 'true'
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const data = JSON.parse(
              fs.readFileSync("_data/network.json", "utf8"),
          );

          if (!Array.isArray(data)) {
              throw new Error(
                  "_data/network.json must contain an array",
              );
          }

          for (const entry of data) {
              if (
                  !entry ||
                  typeof entry !== "object" ||
                  typeof entry.origin !== "string" ||
                  typeof entry.domain !== "string" ||
                  ![
                      "affirmed",
                      "declined",
                      "undeclared",
                  ].includes(entry.identity)
              ) {
                  throw new Error(
                      "Invalid generated network entry: " +
                      JSON.stringify(entry),
                  );
              }

              if (Object.hasOwn(entry, "elsewhere")) {
                  if (!Array.isArray(entry.elsewhere)) {
                      throw new Error(
                          "elsewhere must be an array: " + entry.origin,
                      );
                  }

                  for (const item of entry.elsewhere) {
                      if (
                          !item ||
                          typeof item !== "object" ||
                          typeof item.url !== "string" ||
                          typeof item.network !== "string" ||
                          typeof item.label !== "string"
                      ) {
                          throw new Error(
                              "Invalid elsewhere item for " +
                              entry.origin +
                              ": " +
                              JSON.stringify(item),
                          );
                      }
                  }
              }
          }

          const blogrolls = JSON.parse(
              fs.readFileSync("_data/blogrolls.json", "utf8"),
          );

          if (
              !blogrolls ||
              typeof blogrolls !== "object" ||
              Array.isArray(blogrolls) ||
              typeof blogrolls.edge_count !== "number"
          ) {
              throw new Error(
                  "_data/blogrolls.json must be a collection document",
              );
          }

          if (JSON.stringify(blogrolls) === "[]") {
              throw new Error("_data/blogrolls.json must not be an empty array");
          }

          const blogrollEdges = Array.isArray(blogrolls.edges)
              ? blogrolls.edges
              : [];

          for (const edge of blogrollEdges) {
              if (
                  !edge ||
                  typeof edge !== "object" ||
                  typeof edge.from !== "string" ||
                  typeof edge.to !== "string" ||
                  typeof edge.blogroll !== "string"
              ) {
                  throw new Error(
                      "Invalid generated blogroll edge: " +
                      JSON.stringify(edge),
                  );
              }
          }

          const opml = fs.readFileSync(
              "assets/network/joshternet.opml",
              "utf8",
          );

          if (!opml.includes("<opml")) {
              throw new Error(
                  "assets/network/joshternet.opml must contain OPML",
              );
          }

          const connections = JSON.parse(
              fs.readFileSync("_data/connections.json", "utf8"),
          );

          if (
              !connections ||
              typeof connections !== "object" ||
              Array.isArray(connections) ||
              typeof connections.edge_count !== "number"
          ) {
              throw new Error(
                  "_data/connections.json must be a collection document",
              );
          }

          const connectionEdges = Array.isArray(connections.edges)
              ? connections.edges
              : [];

          for (const edge of connectionEdges) {
              if (
                  !edge ||
                  typeof edge !== "object" ||
                  typeof edge.from !== "string" ||
                  typeof edge.to !== "string" ||
                  typeof edge.href !== "string" ||
                  String(edge.href).includes("/.well-known/josh")
              ) {
                  throw new Error(
                      "Invalid connection edge: " +
                      JSON.stringify(edge),
                  );
              }
          }

          const topics = JSON.parse(
              fs.readFileSync("_data/topics.json", "utf8"),
          );

          if (
              !topics ||
              typeof topics !== "object" ||
              Array.isArray(topics) ||
              typeof topics.community_count !== "number"
          ) {
              throw new Error(
                  "_data/topics.json must be a collection document",
              );
          }

          const signals = JSON.parse(
              fs.readFileSync("_data/site_signals.json", "utf8"),
          );

          if (
              !signals ||
              typeof signals !== "object" ||
              !Array.isArray(signals.origins)
          ) {
              throw new Error(
                  "_data/site_signals.json must have origins[]",
              );
          }

          console.log(
              `Validated ${data.length} generated network ` +
              `${data.length === 1 ? "entry" : "entries"}, ` +
              `${blogrolls.length} blogroll ` +
              `${blogrolls.length === 1 ? "edge" : "edges"}, ` +
              `${connections.length} connection ` +
              `${connections.length === 1 ? "edge" : "edges"}, and ` +
              `${topics.length} topic` +
              `${topics.length === 1 ? "" : "s"}.`,
          );
          NODE

      - name: Commit generated changes
        id: commit_network
        if: steps.preflight.outputs.needs_sync == 'true'
        env:
          JOSHTERNET_USES_PUBLISH: ${{ vars.JOSHTERNET_USES_PUBLISH || '0' }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Fail closed if main advanced under us before staging.
          git fetch origin main
          HEAD_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse origin/main)"
          if [ "$REMOTE_SHA" != "$BASE_SHA" ] && [ "$REMOTE_SHA" != "$HEAD_SHA" ]; then
            echo "main advanced after BASE_SHA=$BASE_SHA (now $REMOTE_SHA)."
            echo "Failing closed so the next scheduled run can reconcile."
            exit 1
          fi

          # Ignored locally so a developer crawl is not added with git add.
          # Force-add the copies this job just wrote.
          git add -f -- \
            _data/network.json \
            _data/blogrolls.json \
            _data/connections.json \
            _data/topics.json \
            _data/site_signals.json \
            _data/content.json \
            _data/data_manifest.json \
            _data/generation_manifest.json \
            _data/activity.json \
            _data/explore.json \
            _data/topic_views.json \
            _data/connection_topics.json \
            _data/site_views.json \
            _data/search_index.json \
            _data/showcase.json \
            _data/happening.json \
            topics \
            assets/network/joshternet.opml \
            assets/network/sites \
            assets/activity/posters \
            assets/activity/atom.xml \
            _data/made.json \
            _data/past_events.json \
            data/classification/quality-baseline.json
          if [ -f assets/events/joshternet.ics ]; then
            git add -f -- assets/events/joshternet.ics
          fi

          if [ "${JOSHTERNET_USES_PUBLISH}" = "1" ] || [ "${JOSHTERNET_USES_PUBLISH}" = "true" ]; then
            git add -f -- \
              data/uses \
              _data/uses_summary.json \
              assets/data/uses || true
          fi

          # Seeking request bodies are current-only and must never be staged.
          # The Seeking public JSON file is gitignored; keep ephemeral observation
          # state out of git add as well. Live excerpts need a non-commit path.

          if git diff --cached --quiet; then
            echo "Network data is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update Joshternet network"
          git push origin HEAD:main

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild
        if: steps.commit_network.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/pages/builds"
