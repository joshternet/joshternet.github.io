name: Production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: read

jobs:
  smoke:
    name: Check public Joshternet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check public URLs
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone

          def fetch(url):
              request = urllib.request.Request(url, headers={"User-Agent": "JoshternetSmoke/1.0"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read()
                  return response.status, response.headers.get("Content-Type", ""), body

          status, _type, body = fetch("https://joshternet.org/")
          if status != 200 or b"Joshternet" not in body:
              raise SystemExit("homepage failed")

          status, _type, body = fetch("https://joshternet.org/.well-known/josh")
          document = json.loads(body)
          if status != 200 or document.get("version") != 1:
              raise SystemExit("well-known josh failed")

          status, _type, body = fetch("https://joshternet.org/network/data.json")
          rows = json.loads(body)
          if status != 200 or not isinstance(rows, list) or not rows:
              raise SystemExit("network data failed")
          stamps = [
              row.get("latest_declaration_check_at")
              for row in rows
              if isinstance(row, dict) and row.get("latest_declaration_check_at")
          ]
          if not stamps:
              raise SystemExit("network data has no declaration check time")
          newest = max(datetime.fromisoformat(stamp.replace("Z", "+00:00")) for stamp in stamps)
          if datetime.now(timezone.utc) - newest > timedelta(hours=6):
              raise SystemExit("network data is older than 6 hours")

          status, _type, _body = fetch("https://joshternet.org/embed/joshternet-button.js")
          if status != 200:
              raise SystemExit("button script failed")

          status, _type, body = fetch(
              "https://joshternet.org/api/button-state?origin=https://joshternet.org"
          )
          payload = json.loads(body)
          if status != 200 or payload.get("ok") is not True:
              raise SystemExit("button state failed")

          for url in (
              "https://joshternet-declaration-check.joshternet.workers.dev/v1/declaration-check",
              "https://joshternet-seed-nominations.joshternet.workers.dev/v1/seed-nominations",
          ):
              try:
                  status, _type, _body = fetch(url)
              except urllib.error.HTTPError as error:
                  status = error.code
              if status >= 500:
                  raise SystemExit(f"{url} returned {status}")

          status, content_type, _body = fetch(
              "https://joshternet.org/.well-known/http-message-signatures-directory"
          )
          if status != 200 or "application/http-message-signatures-directory+json" not in content_type:
              raise SystemExit("signatures directory failed")
          PY
