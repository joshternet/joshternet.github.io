name: Site quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Build and test site
    runs-on: ubuntu-latest
    # No job timeout: registry rebuild grows with membership. GitHub’s
    # default (360m) is the ceiling for hosted runners.

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Fail closed if Prettier reports dirty files
        run: npm run format:check

      - name: Run library tests with 100% coverage gate
        run: npm run test:coverage

      - name: Install Playwright Chromium
        # Browser binaries come from Playwright's CDN. Do not use
        # --with-deps: apt mirror DNS on GitHub Ubuntu runners fails
        # intermittently (azure.archive.ubuntu.com / archive.ubuntu.com)
        # and blocks the job. Hosted runners already ship Chromium libs.
        run: npx playwright install chromium

      - name: Run browser security tests
        run: npm run test:browser

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install Ruby dependencies
        run: bundle install

      - name: Restore local classifier
        uses: actions/cache@v4
        with:
          path: .tmp/models
          key: uses-model-${{ runner.os }}-${{ hashFiles('data/classification/model-lock.json') }}
          restore-keys: |
            uses-model-${{ runner.os }}-

      - name: Rebuild datasets from the registry and build the site
        run: npm run build

      - name: Run generated site tests
        run: npm run test:site
