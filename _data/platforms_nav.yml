# Platform-specific /.well-known/josh recipes under /implement/platforms/.
# Add a page here after the recipe has been tested. Do not put these in
# implement_nav.yml — that row stays a single Platforms link.
# group drives the Platforms index sections; keep every path stable.
# summary is plain-language chooser copy for Join and the Platforms index.
- title: Astro
  path: /implement/platforms/astro/
  group: static
  summary: Publish the declaration from your site's public files
- title: Eleventy
  path: /implement/platforms/eleventy/
  group: static
  summary: Copy the declaration to the required public path during the build
- title: Hugo
  path: /implement/platforms/hugo/
  group: static
  summary: Publish the declaration from Hugo's static files
- title: Jekyll
  path: /implement/platforms/jekyll/
  group: static
  summary: Include the .well-known directory in the generated website
- title: Quartz
  path: /implement/platforms/quartz/
  group: static
  summary: Copy the declaration into the published output after the build
- title: Next.js
  path: /implement/platforms/nextjs/
  group: framework
  summary: Publish the declaration from public files, including static-export setups
- title: Nuxt
  path: /implement/platforms/nuxt/
  group: framework
  summary: Include the declaration in your generated site's public output
- title: SvelteKit
  path: /implement/platforms/sveltekit/
  group: framework
  summary: Publish the declaration from static files using the documented adapter setup
- title: Ghost
  path: /implement/platforms/ghost/
  group: cms
  summary: Serve the declaration through your web server or reverse proxy
- title: WordPress
  path: /implement/platforms/wordpress/
  group: cms
  summary: Use the Joshternet plugin to serve the declaration
- title: Cloudflare Worker
  path: /implement/platforms/cloudflare-worker/
  group: edge
  summary: Serve the declaration through a Worker route without changing your website's build
