title: Joshternet
description: >-
  Joshternet is an open, decentralized network for people who identify as Josh
  and the independent websites they call home—find sites, topics, and connections
  without a central platform.
keywords: >-
  Joshternet, Josh network, independent websites, indie web, /.well-known/josh,
  personal websites, open web
url: https://joshternet.org
baseurl: ""
lang: en
locale: en_US
theme: null

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

webmention:
  endpoint: "https://webmention.io/joshternet.org/webmention"

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/joshternet-social.png
        height: 630
        width: 1200
        alt: Joshternet logo

include:
  - .well-known

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - LICENSING.md
  - THIRD_PARTY_LICENSES.md
  - node_modules
  - package.json
  - package-lock.json
  - scripts
  - test
  - workers

seed_nominations:
  api_origin: "https://joshternet-seed-nominations.joshternet.workers.dev"
  api_path: "/v1/seed-nominations"
  turnstile_sitekey: "0x4AAAAAAE35BSLuSiXLrlih"

declaration_check:
  api_origin: "https://joshternet-declaration-check.joshternet.workers.dev"

joshternet_button:
  api_origin: "https://joshternet.org"
  embed_src: "https://joshternet.org/embed/joshternet-button.js"
